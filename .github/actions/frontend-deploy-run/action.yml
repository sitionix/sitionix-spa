name: Frontend Deploy Run
description: Run the shared frontend deployment pipeline inside an environment-bound job.

inputs:
  github_environment:
    description: GitHub Environment name used to generate the release id.
    required: true

outputs:
  release_id:
    description: Generated frontend release id.
    value: ${{ steps.release.outputs.release_id }}

runs:
  using: composite
  steps:
    - name: Validate deploy environment secrets
      shell: bash
      run: |
        for secret_name in DEPLOY_VM_HOST DEPLOY_VM_USER DEPLOY_VM_SSH_PRIVATE_KEY; do
          if [[ -z "${!secret_name:-}" ]]; then
            echo "Missing required environment secret: ${secret_name}" >&2
            exit 1
          fi
        done

    - name: Set up Node.js 22.12.0
      uses: actions/setup-node@v4
      with:
        node-version: "22.12.0"

    - name: Set up pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9.15.0

    - name: Cache pnpm store
      uses: actions/cache@v4
      with:
        path: ~/.pnpm-store
        key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-

    - name: Install dependencies
      shell: bash
      run: |
        registry_token="${APP_AFESOX:-${GITHUB_TOKEN:-}}"
        NODE_AUTH_TOKEN="${registry_token}" pnpm install --frozen-lockfile

    - name: Build selected frontend applications
      shell: bash
      run: node scripts/frontend-deploy/build-applications.mjs --plan-file .deploy/deployment-plan.json

    - name: Prepare deployment payload
      id: release
      shell: bash
      run: |
        short_sha="$(git rev-parse --short HEAD)"
        release_id="${{ inputs.github_environment }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${short_sha}"

        node scripts/frontend-deploy/prepare-release.mjs \
          --plan-file .deploy/deployment-plan.json \
          --output-dir .deploy/release \
          --release-id "$release_id"
        chmod +x .deploy/release/payload/bin/deploy-frontend.sh
        tar -C .deploy/release/payload -czf .deploy/frontend-release.tgz .

        echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"

    - name: Configure SSH
      shell: bash
      run: |
        install -m 0700 -d ~/.ssh
        printf '%s\n' "$DEPLOY_VM_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
        chmod 0600 ~/.ssh/id_ed25519
        ssh-keyscan -p "${DEPLOY_VM_PORT:-22}" -H "$DEPLOY_VM_HOST" >> ~/.ssh/known_hosts

    - name: Debug SSH identity
      shell: bash
      run: |
        # Temporary auth diagnostic for secret-source verification.
        public_key_file="$(mktemp)"
        trap 'rm -f "${public_key_file}"' EXIT
        ssh-keygen -y -f ~/.ssh/id_ed25519 > "${public_key_file}"
        ssh-keygen -lf "${public_key_file}" -E sha256
        key_type="$(awk '{print $1}' "${public_key_file}")"
        key_comment="$(awk 'NF >= 3 { print substr($0, index($0, $3)); next } { print "" }' "${public_key_file}")"
        echo "DEPLOY_VM_KEY_TYPE=${key_type}"
        echo "DEPLOY_VM_KEY_COMMENT=${key_comment}"
        echo "DEPLOY_VM_USER=${DEPLOY_VM_USER}"

    - name: Upload payload to VM
      shell: bash
      run: |
        remote_tarball="/tmp/${{ steps.release.outputs.release_id }}.tgz"
        scp -P "${DEPLOY_VM_PORT:-22}" .deploy/frontend-release.tgz "${DEPLOY_VM_USER}@${DEPLOY_VM_HOST}:${remote_tarball}"

    - name: Run remote deployment
      shell: bash
      run: |
        remote_root="/tmp/${{ steps.release.outputs.release_id }}"
        remote_tarball="/tmp/${{ steps.release.outputs.release_id }}.tgz"

        ssh -p "${DEPLOY_VM_PORT:-22}" "${DEPLOY_VM_USER}@${DEPLOY_VM_HOST}" "
          set -euo pipefail
          rm -rf '${remote_root}'
          mkdir -p '${remote_root}'
          tar -xzf '${remote_tarball}' -C '${remote_root}'
          chmod +x '${remote_root}/bin/deploy-frontend.sh'
          '${remote_root}/bin/deploy-frontend.sh'
        "

    - name: Verify deployment
      shell: bash
      run: node scripts/frontend-deploy/verify-deployment.mjs --plan-file .deploy/deployment-plan.json
