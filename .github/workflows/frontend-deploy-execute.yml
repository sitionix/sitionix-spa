name: Frontend Deploy Execute

on:
  workflow_call:
    inputs:
      github_environment:
        required: true
        type: string
      deployment_request:
        required: true
        type: string
      checkout_ref:
        required: true
        type: string
      issue_number:
        required: false
        type: string
        default: ""
      pr_head_ref:
        required: false
        type: string
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.github_environment }}
    env:
      DEPLOY_VM_PORT: ${{ vars.DEPLOY_VM_PORT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref }}
          fetch-depth: 0

      - name: Persist deployment request
        run: |
          mkdir -p .deploy
          cat <<'EOF' > .deploy/deployment-request.json
          ${{ inputs.deployment_request }}
          EOF

      - name: Materialize deployment plan
        env:
          FRONTEND_HOST_SHELL: ${{ vars.FRONTEND_HOST_SHELL }}
          FRONTEND_HOST_AUTH: ${{ vars.FRONTEND_HOST_AUTH }}
          FRONTEND_HOST_WORKSPACE: ${{ vars.FRONTEND_HOST_WORKSPACE }}
          FRONTEND_HOST_BUILDER: ${{ vars.FRONTEND_HOST_BUILDER }}
          FRONTEND_API_BASE_URL: ${{ vars.FRONTEND_API_BASE_URL }}
          FRONTEND_WORKSPACE_USE_MOCKS: ${{ vars.FRONTEND_WORKSPACE_USE_MOCKS }}
          DEPLOY_BFF_PROXY_TARGET: ${{ vars.DEPLOY_BFF_PROXY_TARGET }}
          DEPLOY_APP_ROOT: ${{ vars.DEPLOY_APP_ROOT }}
          DEPLOY_RUNTIME_ROOT: ${{ vars.DEPLOY_RUNTIME_ROOT }}
          DEPLOY_BACKUP_ROOT: ${{ vars.DEPLOY_BACKUP_ROOT }}
          DEPLOY_NGINX_SITE_PATH: ${{ vars.DEPLOY_NGINX_SITE_PATH }}
          DEPLOY_NGINX_SITE_LINK_PATH: ${{ vars.DEPLOY_NGINX_SITE_LINK_PATH }}
          DEPLOY_SUDO_COMMAND: ${{ vars.DEPLOY_SUDO_COMMAND }}
          DEPLOY_SSL_SHELL_CERT_PATH: ${{ vars.DEPLOY_SSL_SHELL_CERT_PATH }}
          DEPLOY_SSL_SHELL_KEY_PATH: ${{ vars.DEPLOY_SSL_SHELL_KEY_PATH }}
          DEPLOY_SSL_AUTH_CERT_PATH: ${{ vars.DEPLOY_SSL_AUTH_CERT_PATH }}
          DEPLOY_SSL_AUTH_KEY_PATH: ${{ vars.DEPLOY_SSL_AUTH_KEY_PATH }}
          DEPLOY_SSL_WORKSPACE_CERT_PATH: ${{ vars.DEPLOY_SSL_WORKSPACE_CERT_PATH }}
          DEPLOY_SSL_WORKSPACE_KEY_PATH: ${{ vars.DEPLOY_SSL_WORKSPACE_KEY_PATH }}
          DEPLOY_SSL_BUILDER_CERT_PATH: ${{ vars.DEPLOY_SSL_BUILDER_CERT_PATH }}
          DEPLOY_SSL_BUILDER_KEY_PATH: ${{ vars.DEPLOY_SSL_BUILDER_KEY_PATH }}
        run: |
          node scripts/frontend-deploy/materialize-deployment-plan.mjs \
            --request-file .deploy/deployment-request.json \
            --output-file .deploy/deployment-plan.json

          summary="$(node -e 'const fs = require(\"node:fs\"); const plan = JSON.parse(fs.readFileSync(\".deploy/deployment-plan.json\", \"utf8\")); process.stdout.write(plan.summary);')"
          echo "DEPLOY_SUMMARY=${summary}" >> "$GITHUB_ENV"
          echo "DEPLOYMENT_PLAN_JSON<<EOF" >> "$GITHUB_ENV"
          cat .deploy/deployment-plan.json >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: Validate deploy environment secrets
        env:
          DEPLOY_VM_HOST: ${{ secrets.DEPLOY_VM_HOST }}
          DEPLOY_VM_USER: ${{ secrets.DEPLOY_VM_USER }}
          DEPLOY_VM_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_VM_SSH_PRIVATE_KEY }}
        run: |
          for secret_name in DEPLOY_VM_HOST DEPLOY_VM_USER DEPLOY_VM_SSH_PRIVATE_KEY; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "Missing required environment secret: ${secret_name}" >&2
              exit 1
            fi
          done

      - name: Post start comment
        if: inputs.issue_number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = Number("${{ inputs.issue_number }}");
            const workflow_run_url = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const body = [
              '---',
              '### Frontend deployment started',
              '',
              `- Target: ${process.env.DEPLOY_SUMMARY}`,
              `- Branch: ${{ inputs.pr_head_ref }}`,
              `- Workflow: ${workflow_run_url}`,
              '---',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body,
            });

      - name: Set up Node.js 22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.0

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build selected frontend applications
        run: node scripts/frontend-deploy/build-applications.mjs --plan-file .deploy/deployment-plan.json

      - name: Prepare deployment payload
        id: release
        run: |
          short_sha="$(git rev-parse --short HEAD)"
          release_id="${{ inputs.github_environment }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${short_sha}"

          node scripts/frontend-deploy/prepare-release.mjs \
            --plan-file .deploy/deployment-plan.json \
            --output-dir .deploy/release \
            --release-id "$release_id"
          chmod +x .deploy/release/payload/bin/deploy-frontend.sh
          tar -C .deploy/release/payload -czf .deploy/frontend-release.tgz .

          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          DEPLOY_VM_HOST: ${{ secrets.DEPLOY_VM_HOST }}
          DEPLOY_VM_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_VM_SSH_PRIVATE_KEY }}
        run: |
          install -m 0700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_VM_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${DEPLOY_VM_PORT:-22}" -H "$DEPLOY_VM_HOST" >> ~/.ssh/known_hosts

      - name: Upload payload to VM
        env:
          DEPLOY_VM_HOST: ${{ secrets.DEPLOY_VM_HOST }}
          DEPLOY_VM_USER: ${{ secrets.DEPLOY_VM_USER }}
        run: |
          remote_tarball="/tmp/${{ steps.release.outputs.release_id }}.tgz"
          scp -P "${DEPLOY_VM_PORT:-22}" .deploy/frontend-release.tgz "${DEPLOY_VM_USER}@${DEPLOY_VM_HOST}:${remote_tarball}"

      - name: Run remote deployment
        env:
          DEPLOY_VM_HOST: ${{ secrets.DEPLOY_VM_HOST }}
          DEPLOY_VM_USER: ${{ secrets.DEPLOY_VM_USER }}
        run: |
          remote_root="/tmp/${{ steps.release.outputs.release_id }}"
          remote_tarball="/tmp/${{ steps.release.outputs.release_id }}.tgz"

          ssh -p "${DEPLOY_VM_PORT:-22}" "${DEPLOY_VM_USER}@${DEPLOY_VM_HOST}" "
            set -euo pipefail
            rm -rf '${remote_root}'
            mkdir -p '${remote_root}'
            tar -xzf '${remote_tarball}' -C '${remote_root}'
            chmod +x '${remote_root}/bin/deploy-frontend.sh'
            '${remote_root}/bin/deploy-frontend.sh'
          "

      - name: Verify deployment
        run: node scripts/frontend-deploy/verify-deployment.mjs --plan-file .deploy/deployment-plan.json

      - name: Post success comment
        if: success() && inputs.issue_number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = Number("${{ inputs.issue_number }}");
            const body = [
              '---',
              '### Frontend deployment succeeded',
              '',
              `- Target: ${process.env.DEPLOY_SUMMARY}`,
              `- Release: ${{ steps.release.outputs.release_id }}`,
              '---',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body,
            });

      - name: Post failure comment
        if: failure() && inputs.issue_number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = Number("${{ inputs.issue_number }}");
            const workflow_run_url = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const body = [
              '---',
              '### Frontend deployment failed',
              '',
              `- Target: ${process.env.DEPLOY_SUMMARY}`,
              `- Workflow: ${workflow_run_url}`,
              '---',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body,
            });
