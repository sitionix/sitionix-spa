name: Frontend Deploy On Push

on:
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/frontend-deploy-on-push.yml"
      - ".github/workflows/frontend-deploy-execute.yml"
      - "apps/**"
      - "deploy/frontend/**"
      - "packages/**"
      - "scripts/frontend-deploy/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.resolve.outputs.enabled }}
      github_environment: ${{ steps.resolve.outputs.github_environment }}
      deployment_request: ${{ steps.resolve.outputs.deployment_request }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve deployment target
        id: resolve
        env:
          DEPLOY_EVENT_NAME: push
          DEPLOY_REF_NAME: ${{ github.ref_name }}
        run: node scripts/frontend-deploy/resolve-workflow-context.mjs >> "$GITHUB_OUTPUT"

  deploy:
    needs: resolve
    if: needs.resolve.outputs.enabled == 'true'
    uses: ./.github/workflows/frontend-deploy-execute.yml
    with:
      github_environment: ${{ needs.resolve.outputs.github_environment }}
      deployment_request: ${{ needs.resolve.outputs.deployment_request }}
      checkout_ref: ${{ github.sha }}
