name: Frontend Deploy On Comment

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write
  pull-requests: write
  packages: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.resolve.outputs.enabled }}
      github_environment: ${{ steps.resolve.outputs.github_environment }}
      deployment_request: ${{ steps.resolve.outputs.deployment_request }}
      checkout_ref: ${{ steps.checkout_ref.outputs.value }}
      issue_number: ${{ steps.issue_number.outputs.value }}
      pr_head_ref: ${{ steps.pr.outputs.head_ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Read pull request metadata
        id: pr
        if: github.event.issue.pull_request
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            core.setOutput("head_ref", pr.data.head.ref);
            core.setOutput("head_sha", pr.data.head.sha);
            core.setOutput(
              "same_repo",
              pr.data.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}` ? "true" : "false"
            );

      - name: Checkout pull request head for config resolution
        if: github.event.issue.pull_request && steps.pr.outputs.same_repo == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}

      - name: Resolve deployment target
        id: resolve
        env:
          DEPLOY_EVENT_NAME: issue_comment
          DEPLOY_COMMENT_BODY: ${{ github.event.comment.body }}
          DEPLOY_IS_PULL_REQUEST: ${{ github.event.issue.pull_request && 'true' || 'false' }}
        run: node scripts/frontend-deploy/resolve-workflow-context.mjs >> "$GITHUB_OUTPUT"

      - name: Reject fork-based PR deploys
        if: steps.resolve.outputs.enabled == 'true' && steps.pr.outputs.same_repo != 'true'
        run: |
          echo "PR comment deployments are allowed only for branches in this repository." >&2
          exit 1

      - name: Compute checkout ref
        id: checkout_ref
        run: |
          if [[ "${{ steps.resolve.outputs.enabled }}" == "true" ]]; then
            echo "value=${{ steps.pr.outputs.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Capture issue number
        id: issue_number
        run: |
          if [[ "${{ steps.resolve.outputs.enabled }}" == "true" ]]; then
            echo "value=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: resolve
    if: needs.resolve.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.github_environment }}
    env:
      DEPLOY_VM_PORT: ${{ vars.DEPLOY_VM_PORT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Persist deployment request
        run: |
          mkdir -p .deploy
          cat <<'EOF' > .deploy/deployment-request.json
          ${{ needs.resolve.outputs.deployment_request }}
          EOF

      - name: Materialize deployment plan
        id: materialize
        env:
          FRONTEND_HOST_SHELL: ${{ vars.FRONTEND_HOST_SHELL }}
          FRONTEND_HOST_AUTH: ${{ vars.FRONTEND_HOST_AUTH }}
          FRONTEND_HOST_WORKSPACE: ${{ vars.FRONTEND_HOST_WORKSPACE }}
          FRONTEND_HOST_BUILDER: ${{ vars.FRONTEND_HOST_BUILDER }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          FRONTEND_WORKSPACE_USE_MOCKS: ${{ vars.FRONTEND_WORKSPACE_USE_MOCKS }}
          DEPLOY_BFF_PROXY_TARGET: ${{ vars.DEPLOY_BFF_PROXY_TARGET }}
        run: |
          node scripts/frontend-deploy/materialize-deployment-plan.mjs \
            --request-file .deploy/deployment-request.json \
            --output-file .deploy/deployment-plan.json

          summary="$(node -p "JSON.parse(require('node:fs').readFileSync('.deploy/deployment-plan.json', 'utf8')).summary")"
          echo "summary=${summary}" >> "$GITHUB_OUTPUT"

      - name: Post start comment
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = Number("${{ needs.resolve.outputs.issue_number }}");
            const workflow_run_url = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const body = [
              '---',
              '### Frontend deployment started',
              '',
              `- Target: ${{ steps.materialize.outputs.summary }}`,
              `- Branch: ${{ needs.resolve.outputs.pr_head_ref }}`,
              `- Workflow: ${workflow_run_url}`,
              '---',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body,
            });

      - name: Execute deployment
        id: execute
        uses: ./.github/actions/frontend-deploy-run
        with:
          github_environment: ${{ needs.resolve.outputs.github_environment }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DEPLOY_VM_PORT: ${{ vars.DEPLOY_VM_PORT }}
          DEPLOY_VM_HOST: ${{ secrets.DEPLOY_VM_HOST }}
          DEPLOY_VM_USER: ${{ secrets.DEPLOY_VM_USER }}
          DEPLOY_VM_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_VM_SSH_PRIVATE_KEY_DEV_ONLY }}

      - name: Post success comment
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = Number("${{ needs.resolve.outputs.issue_number }}");
            const body = [
              '---',
              '### Frontend deployment succeeded',
              '',
              `- Target: ${{ steps.materialize.outputs.summary }}`,
              `- Release: ${{ steps.execute.outputs.release_id }}`,
              '---',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body,
            });

      - name: Post failure comment
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = Number("${{ needs.resolve.outputs.issue_number }}");
            const workflow_run_url = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const body = [
              '---',
              '### Frontend deployment failed',
              '',
              `- Target: ${{ steps.materialize.outputs.summary }}`,
              `- Workflow: ${workflow_run_url}`,
              '---',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body,
            });
